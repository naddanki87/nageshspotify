spring.application.name=nageshspotify
server.port=${PORT:8080}

# Your likes, playlists and recently played songs are stored in an H2 file database under ./data
spring.datasource.url=jdbc:h2:file:./data/nageshspotify;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Errors are returned as RFC 7807 problem details; the UI shows their "detail"
spring.mvc.problemdetails.enabled=true
